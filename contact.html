</head>
<body>

  <div id="particles-js"></div>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">ANN</a>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
        <li><a href="projects.html" class="nav-link">Projects</a></li>
        <li><a href="contact.html" class="nav-link active">Contact</a></li>
        <li><button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
  <!-- Moon Icon (Dark Mode) -->
  <svg class="icon moon-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
    <path d="M21.64 13.36a10 10 0 01-12.99-12.99 10 10 0 1012.99 12.99z"/>
  </svg>
  <!-- Sun Icon (Light Mode) -->
  <svg class="icon sun-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
    <path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0-5v2m0 14v2m7.07-12.07l1.41-1.41m-12.72 0L6.34 6.34m12.72 12.72l-1.41 1.41m-12.72 0l1.41 1.41M12 2a10 10 0 110 20 10 10 0 010-20z"/>
  </svg>
</button></li>
      </ul>
    </div>
  </nav>

  <main>
    <section class="contact-hero">
      <div class="container">
        <div class="contact-grid">
          <div class="contact-title">
            <h1 class="glitch" data-text="GET IN TOUCH">GET IN TOUCH</h1>
            <p class="subtitle">Send a message. Let's build the future.</p>
            <div class="scan-line"></div>
          </div>

          <div class="contact-form-container">
            <form id="contact-form" class="contact-form glass">
              <div class="input-group">
                <input type="text" id="name" placeholder=" " required>
                <label for="name">Your Name</label>
                <div class="input-glow"></div>
              </div>
              <div class="input-group">
                <input type="email" id="email" placeholder=" " required>
                <label for="email">Your Email</label>
                <div class="input-glow"></div>
              </div>
              <div class="input-group">
                <textarea id="message" rows="4" placeholder=" " required></textarea>
                <label for="message">Your Message</label>
                <div class="input-glow"></div>
              </div>
              <button type="submit" class="btn-submit">
                <span>Send Message</span>
                <div class="btn-glow"></div>
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2025 Ann Peter Wayua – <span class="footer-tag">Chemistry × Code</span></p>
  </footer>

  <script src="js/particles.js"></script>
  <script src="js/script.js"></script>

</html>
